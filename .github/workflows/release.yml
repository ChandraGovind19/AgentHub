# Builds the macOS app (Apple Silicon and Intel) and attaches the .dmg/.zip files to a GitHub Release.
# Trigger: push a tag like v0.8.0. Unsigned builds: users right-click > Open on first launch (see README).
# To sign and notarize later, add CSC_LINK, CSC_KEY_PASSWORD, APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD and APPLE_TEAM_ID secrets; electron-builder picks them up automatically.
name: Release macOS app
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm test
      - run: npm run desktop:install
      - run: npm run desktop:dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.CSC_LINK != '' }}
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            desktop/dist/*.dmg
            desktop/dist/*.zip
          generate_release_notes: true
      - uses: actions/upload-artifact@v4
        with:
          name: AgentHub-mac
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.zip
