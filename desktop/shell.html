<!doctype html><html lang="en"><head><meta charset="utf-8"><title>AgentHub</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'; img-src data:">
<style>
:root{--bg:#0c121b;--raised:#16202e;--rule:#26324a;--rule-2:#34435e;--text:#f1ede4;--muted:#93a0b6;--faint:#5f6d85;--claude:#f2a33c;--codex:#38d1c2;--bad:#ff6b6b;--display:"Avenir Next Condensed","Helvetica Neue","Arial Narrow",sans-serif;--body:"Avenir Next","Helvetica Neue",Helvetica,Arial,sans-serif;--mono:"SF Mono",Menlo,Consolas,monospace}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{width:250px;display:flex;flex-direction:column;background:var(--bg);color:var(--text);font:13px/1.4 var(--body);border-right:1px solid var(--rule);overflow:hidden;user-select:none}
.titlebar{height:52px;flex:none;-webkit-app-region:drag;display:flex;align-items:center;gap:9px;padding:14px 14px 0 78px}.titlebar svg{flex:none;border-radius:5px}.titlebar span{font:600 13px/1 var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.label{padding:16px 14px 6px;font:600 10px/1 var(--display);letter-spacing:.16em;text-transform:uppercase;color:var(--faint);display:flex;justify-content:space-between;align-items:baseline}.label small{font:11px var(--mono);letter-spacing:0;text-transform:none}
.list{flex:1;overflow:auto;padding:0 8px}
.project{position:relative;display:block;width:100%;text-align:left;border:0;border-left:2px solid transparent;border-radius:0 6px 6px 0;background:transparent;color:inherit;padding:9px 28px 9px 10px;margin-bottom:2px;cursor:default;font:inherit}
.project:hover{background:var(--raised)}.project.active{background:var(--raised);border-left-color:var(--text)}.project.active.agent-claude{border-left-color:var(--claude)}.project.active.agent-codex{border-left-color:var(--codex)}
.name{display:flex;align-items:baseline;gap:8px;min-width:0}.name b{flex:1;min-width:0;font:600 15px/1.2 var(--display);letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.name kbd{font:11px var(--mono);color:var(--faint)}
.line{margin-top:4px;display:flex;align-items:center;gap:6px;min-width:0;font:11px var(--mono);color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.dot{flex:none;width:7px;height:7px;border-radius:50%;background:var(--faint)}.dot.claude{background:var(--claude)}.dot.codex{background:var(--codex)}.dot.bad{background:var(--bad)}.dot.live{animation:pulse 1.6s infinite}@keyframes pulse{50%{opacity:.3}}
.line.claude{color:var(--claude)}.line.codex{color:var(--codex)}.line.bad{color:var(--bad)}
.close{position:absolute;right:6px;top:8px;width:20px;height:20px;border:0;border-radius:4px;background:transparent;color:var(--faint);font:14px/1 var(--body);cursor:default;opacity:0}.project:hover .close,.project.active .close{opacity:1}.close:hover{background:var(--rule);color:var(--text)}
.empty{margin:8px 6px;padding:18px 14px;border:1px dashed var(--rule-2);border-radius:6px;color:var(--muted);font-size:12px;line-height:1.5}.empty b{display:block;color:var(--text);font:600 15px/1.2 var(--display);letter-spacing:.02em;margin-bottom:6px}
.footer{flex:none;border-top:1px solid var(--rule);padding:8px}
.open{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;border:1px solid var(--rule-2);border-radius:6px;background:transparent;color:var(--text);padding:9px 12px;cursor:default;font:600 12px/1 var(--display);letter-spacing:.08em;text-transform:uppercase}.open:hover{background:var(--raised);border-color:var(--muted)}.open kbd{font:11px var(--mono);color:var(--faint);letter-spacing:0}
.version{padding:8px 6px 4px;font:10px var(--mono);color:var(--faint)}
:focus-visible{outline:2px solid var(--claude);outline-offset:1px}
</style></head><body>
<div class="titlebar"><svg width="18" height="18" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="16" fill="#141a26"/><path d="M14 18l14 14-14 14" fill="none" stroke="#f2a33c" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M50 18L36 32l14 14" fill="none" stroke="#38d1c2" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="32" cy="32" r="4.5" fill="#e8ecf4"/></svg><span>AgentHub</span></div>
<div class="label"><span>Projects</span><small id="count"></small></div>
<div class="list" id="list"></div>
<div class="footer"><button class="open" id="add" type="button"><span>+ Open project</span><kbd>⌘O</kbd></button><div class="version" id="version"></div></div>
<script src="shell.js"></script></body></html>
